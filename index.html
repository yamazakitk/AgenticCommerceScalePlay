<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harvest & Co. | 自然の恵みを食卓へ。プレミアム有機スーパーマーケット</title>
  <meta name="description" content="厳選された有機栽培野菜、新鮮な鮮魚、極上の精肉をお届けするスーパーマーケット Harvest & Co. のオンラインストアです。">
  
  <!-- CSS Link -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header Placeholder (Injected via cart.js) -->
  <div id="header-placeholder"></div>

  <main>
    <!-- Hero Banner Section -->
    <section class="hero-section">
      <div class="container hero-content">
        <span class="hero-badge">ORGANIC & FRESH GROCERY</span>
        <h1 class="hero-title">自然の恵みを、<br>そのまま食卓へ。</h1>
        <p class="hero-desc">信頼できる生産者から直接仕入れた新鮮で安全な食材。私たちのこだわりが、あなたの健やかな毎日をサポートします。</p>
        <a href="#catalog" class="hero-btn">
          今すぐお買い物
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
          </svg>
        </a>
      </div>
    </section>

    <!-- Catalog Section -->
    <section id="catalog" class="container section-padding">
      
      <!-- Category Pills Wrapper -->
      <div class="category-wrapper">
        <div class="category-list" id="category-list">
          <button class="category-pill active" data-category="all" onclick="filterCategory('all')">すべて見る</button>
          <button class="category-pill" data-category="vegetables" onclick="filterCategory('vegetables')">新鮮野菜</button>
          <button class="category-pill" data-category="fruits" onclick="filterCategory('fruits')">特選果物</button>
          <button class="category-pill" data-category="meat" onclick="filterCategory('meat')">上質精肉</button>
          <button class="category-pill" data-category="seafood" onclick="filterCategory('seafood')">新鮮鮮魚</button>
          <button class="category-pill" data-category="dairy" onclick="filterCategory('dairy')">卵・乳製品</button>
          <button class="category-pill" data-category="bakery" onclick="filterCategory('bakery')">ベーカリー</button>
          <button class="category-pill" data-category="beverages" onclick="filterCategory('beverages')">飲料・お茶</button>
          <button class="category-pill" data-category="pantry" onclick="filterCategory('pantry')">米・調味料</button>
        </div>
      </div>

      <div class="catalog-header" style="margin-top: var(--space-xl);">
        <h2 class="catalog-title" id="catalog-title">おすすめの商品</h2>
        <div style="display: flex; gap: var(--space-md); align-items: center;">
          <select id="sort-select" class="sort-select" onchange="handleSortChange()">
            <option value="default">並び替え: おすすめ順</option>
            <option value="price-asc">価格の安い順</option>
            <option value="price-desc">価格の高い順</option>
            <option value="rating">評価の高い順</option>
          </select>
        </div>
      </div>

      <!-- Product Grid -->
      <div class="product-grid" id="product-grid">
        <!-- Dynamic content injected by app.js -->
      </div>

      <!-- No Results State -->
      <div id="no-results" class="empty-cart-message" style="display: none;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="48" height="48">
          <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <h3 class="empty-cart-title">一致する商品が見つかりません</h3>
        <p class="empty-cart-desc">キーワードを変更して、もう一度検索してみてください。</p>
        <button class="return-shop-btn" onclick="resetSearch()">すべての商品を表示</button>
      </div>

    </section>
  </main>

  <!-- Cart Drawer Placeholder (Injected via cart.js) -->
  <div id="drawer-placeholder"></div>

  <!-- Footer Placeholder (Injected via cart.js) -->
  <div id="footer-placeholder"></div>

  <!-- Javascript Scripts -->
  <script src="js/firebase-config.js?v=2026083101"></script>
  <script src="js/agent-widget.js?v=2026083101"></script>
  <script src="js/products.js?v=2026083101"></script>
  <script src="js/cart.js?v=2026083101"></script>
  <script src="js/app.js?v=2026083101"></script>
</body>
</html>
